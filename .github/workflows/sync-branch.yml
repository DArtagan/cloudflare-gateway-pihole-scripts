name: Sync branch

on:
  push:
    branches:
      - main

jobs:
  sync-branch:
    name: Update v1 branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only run on this fork. Publish builds from v1, so without this sync a push
    # to main produces an image built from whatever v1 last held -- a fresh tag
    # on stale source. Upstream's id is 635386785; this line is fork-local and
    # must never be sent back in a pull request.
    if: ${{ github.repository_id == 1208783890 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: connor-baer/action-sync-branch@066ffc273774493f6327c8f373ef14228961af9c # v2.0.1
        with:
          branch: v1
          token: ${{ secrets.GITHUB_TOKEN }}
          # Force push is enabled since v1 is supposed to be an exact copy of main until breaking changes are made
          force: true
